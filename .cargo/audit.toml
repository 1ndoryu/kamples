# Excepciones de cargo-audit. Cada una lleva motivo, decisión y fecha de vencimiento.
# cargo-audit no tiene caducidad: el vencimiento vive aquí y en roadmap.md (aviso de revisión).

[advisories]
ignore = [
    # RUSTSEC-2023-0071 (rsa 0.9.10, Marvin Attack, sin parche).
    # Motivo: `rsa` solo entra por `sqlx-mysql`, dependencia opcional de sqlx que ya NO se activa
    # ([16A-4], 2026-10-16: `default-features = false` en los dos Cargo.toml quitó la feature `any`;
    # `cargo tree -i rsa` y `cargo tree -i sqlx-mysql` dicen "nothing to print" y
    # `cargo check --all-targets` compila en verde sin ellos). El backend no hace operaciones RSA.
    # Pero siguen en Cargo.lock: el lock es independiente de features y cargo los vuelve a añadir al
    # re-resolver (probado: borrarlos del lock, incluso con sus aristas, y cargo los repone), así que
    # no se pueden podar a mano. [corregido 16AA-19] Aquí decía que regenerar el lock era imposible
    # porque `zip` estaba *yanked* salvo 9.0.3/9.0.4: es falso. Comprobado contra crates.io el
    # 2026-10-16, quedan 9 versiones sin yanked (9.0.4, 9.0.3, 8.6.0, 7.4.0, 6.0.0, 5.1.1, 4.6.1,
    # 3.0.0, 2.6.1), y `zip 8.6.0` sí satisface a `utoipa-swagger-ui` 10.x (que pide ^8.6), así que
    # el lock se puede regenerar. Da igual: regenerarlo NO quitaría `rsa`, porque el lock lista las
    # dependencias opcionales y `rsa` entra por `sqlx-mysql 0.8.6` (Cargo.lock:4472), que está en el
    # lock aunque la feature `any` de sqlx esté apagada. Es decir, `zip` nunca fue el motivo de que
    # esta excepción siga haciendo falta; el motivo real es que el lock no se poda.
    # Decidido: excepción de 1 mes (2026-10-12). VENCE 2026-11-12.
    # Al vencer: renovar con fecha nueva; solo se puede quitar cuando el lock se regenere (ver [16A-4]).
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0367/0368/0369 (zip 1.1.4, parche en 9.0.0). Motivo: `zip` 1.x entra solo como
    # build-dependency de utoipa-swagger-ui 7.1.0 (`cargo tree -i zip@1.1.4`): solo lo usa su build.rs
    # para descomprimir Swagger UI en build, una entrada fija y no del usuario. El código del backend
    # usa zip 9 (colecciones/zip.rs). Decidido: excepción de 1 mes (2026-10-18).
    # VENCE 2026-11-18. Al vencer: subir utoipa-swagger-ui a 10.x (zip 8.6+) y quitar la entrada.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    # RUSTSEC-2026-0387 (crypto-bigint 0.5.5, variabilidad de tiempo). Motivo: sin parche dentro de la
    # línea 0.13; entra por p256 0.13.2 ← {glory-backend, web-push-native 0.5.0}. web-push-native solo se
    # usa en src/services/notificaciones/push.rs. Decidido: excepción de 1 mes
    # (2026-10-26). VENCE 2026-11-26. Al vencer: migrar web-push-native o subir p256 a 0.14+ (ver roadmap, Bloqueos).
    "RUSTSEC-2026-0387",
]
